language = "C"
include_guard = "SOIL_RT_H"
cpp_compat = true
documentation = true
header = "/* soil-rt C ABI — generated by cbindgen; do not edit. */"
after_includes = """
typedef struct SoilRuntime SoilRuntime;
typedef struct SoilValue SoilValue;
typedef struct SoilError SoilError;
"""

[export]
exclude = ["SoilRuntime", "Value", "SoilError"]

[export.rename]
"Value" = "SoilValue"

[parse]
parse_deps = false
